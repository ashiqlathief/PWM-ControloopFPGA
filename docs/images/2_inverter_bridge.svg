<polygon points="545,200 536,195 536,205" fill="#1f4e9c"/>
<line x1="170" y1="330" x2="470" y2="330" stroke="#222" stroke-width="3"/>
<line x1="320" y1="330" x2="320" y2="345" stroke="#222" stroke-width="2"/>
<polyline points="320,345 312,352 328,362 312,372 328,382 312,392 320,398" fill="none" stroke="#222" stroke-width="2"/>
<line x1="320" y1="398" x2="320" y2="408" stroke="#222" stroke-width="2"/>
<line x1="306" y1="408" x2="334" y2="408" stroke="#222" stroke-width="2.5"/><line x1="311" y1="413" x2="329" y2="413" stroke="#222" stroke-width="2"/><line x1="316" y1="418" x2="324" y2="418" stroke="#222" stroke-width="2"/>
<text x="345" y="376" fill="#333">Current sense (shunt resistor)</text>
<text x="12" y="448" font-size="12" fill="#555">Phases A, B, C connect to the star-connected motor windings.</text><text x="12" y="464" font-size="12" fill="#555">U V W X Y Z are the FPGA outputs of the commutation logic.</text>
