<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Arial, Helvetica, sans-serif" font-size="14">
<rect width="720" height="470" fill="#ffffff"/>
<text x="360.0" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Three-phase inverter bridge driven by the FPGA outputs</text>
<line x1="90" y1="70" x2="560" y2="70" stroke="#222" stroke-width="3"/>
<text x="86" y="75" text-anchor="end" font-weight="bold">+V supply</text>
<line x1="170" y1="70" x2="170" y2="110" stroke="#222" stroke-width="2"/>
<rect x="138" y="110" width="64" height="50" rx="4" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.5"/>
<text x="170" y="132" text-anchor="middle" font-weight="bold" fill="#c0392b">AH</text>
<text x="170" y="150" text-anchor="middle" font-size="12" fill="#555">gate = U</text>
<line x1="170" y1="160" x2="170" y2="240" stroke="#222" stroke-width="2"/>
<rect x="138" y="240" width="64" height="50" rx="4" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.5"/>
<text x="170" y="262" text-anchor="middle" font-weight="bold" fill="#c0392b">AL</text>
<text x="170" y="280" text-anchor="middle" font-size="12" fill="#555">gate = X</text>
<line x1="170" y1="290" x2="170" y2="330" stroke="#222" stroke-width="2"/>
<circle cx="170" cy="200" r="4" fill="#222"/>
<line x1="170" y1="200" x2="245" y2="200" stroke="#c0392b" stroke-width="2.5"/>
<text x="210" y="190" text-anchor="middle" font-weight="bold" fill="#c0392b">phase A</text>
<polygon points="245,200 236,195 236,205" fill="#c0392b"/>
<line x1="320" y1="70" x2="320" y2="110" stroke="#222" stroke-width="2"/>
<rect x="288" y="110" width="64" height="50" rx="4" fill="#f4f6f8" stroke="#1e8449" stroke-width="2.5"/>
<text x="320" y="132" text-anchor="middle" font-weight="bold" fill="#1e8449">BH</text>
<text x="320" y="150" text-anchor="middle" font-size="12" fill="#555">gate = V</text>
<line x1="320" y1="160" x2="320" y2="240" stroke="#222" stroke-width="2"/>
<rect x="288" y="240" width="64" height="50" rx="4" fill="#f4f6f8" stroke="#1e8449" stroke-width="2.5"/>
<text x="320" y="262" text-anchor="middle" font-weight="bold" fill="#1e8449">BL</text>
<text x="320" y="280" text-anchor="middle" font-size="12" fill="#555">gate = Y</text>
<line x1="320" y1="290" x2="320" y2="330" stroke="#222" stroke-width="2"/>
<circle cx="320" cy="200" r="4" fill="#222"/>
<line x1="320" y1="200" x2="395" y2="200" stroke="#1e8449" stroke-width="2.5"/>
