<polygon points="395,200 386,195 386,205" fill="#1e8449"/>
<line x1="470" y1="70" x2="470" y2="110" stroke="#222" stroke-width="2"/>
<rect x="438" y="110" width="64" height="50" rx="4" fill="#f4f6f8" stroke="#1f4e9c" stroke-width="2.5"/>
<text x="470" y="132" text-anchor="middle" font-weight="bold" fill="#1f4e9c">CH</text>
<text x="470" y="150" text-anchor="middle" font-size="12" fill="#555">gate = W</text>
<line x1="470" y1="160" x2="470" y2="240" stroke="#222" stroke-width="2"/>
<rect x="438" y="240" width="64" height="50" rx="4" fill="#f4f6f8" stroke="#1f4e9c" stroke-width="2.5"/>
<text x="470" y="262" text-anchor="middle" font-weight="bold" fill="#1f4e9c">CL</text>
<text x="470" y="280" text-anchor="middle" font-size="12" fill="#555">gate = Z</text>
<line x1="470" y1="290" x2="470" y2="330" stroke="#222" stroke-width="2"/>
<circle cx="470" cy="200" r="4" fill="#222"/>
<line x1="470" y1="200" x2="545" y2="200" stroke="#1f4e9c" stroke-width="2.5"/>
