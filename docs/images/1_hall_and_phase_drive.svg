<line x1="620" y1="82" x2="620" y2="575" stroke="#ccc" stroke-dasharray="4 4"/>
<line x1="720" y1="82" x2="720" y2="575" stroke="#ccc" stroke-dasharray="4 4"/>
<text x="106" y="114" text-anchor="end" font-weight="bold" fill="#c0392b">Hall A</text>
<polyline points="120,96 220,96 220,96 320,96 320,96 420,96 420,96 420,120 520,120 520,120 620,120 620,120 720,120" fill="none" stroke="#c0392b" stroke-width="2.5"/>
