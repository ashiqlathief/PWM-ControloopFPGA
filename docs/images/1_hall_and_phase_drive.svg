<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" font-family="Arial, Helvetica, sans-serif" font-size="14">
<rect width="760" height="640" fill="#ffffff"/>
<text x="380.0" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Six-step commutation: Hall signals and phase drive</text>
<text x="170.0" y="56" text-anchor="middle" fill="#333">Sector 1</text>
<text x="170.0" y="74" text-anchor="middle" fill="#666" font-size="12">0° to 60°</text>
<text x="270.0" y="56" text-anchor="middle" fill="#333">Sector 2</text>
<text x="270.0" y="74" text-anchor="middle" fill="#666" font-size="12">60° to 120°</text>
<text x="370.0" y="56" text-anchor="middle" fill="#333">Sector 3</text>
<text x="370.0" y="74" text-anchor="middle" fill="#666" font-size="12">120° to 180°</text>
<text x="470.0" y="56" text-anchor="middle" fill="#333">Sector 4</text>
<text x="470.0" y="74" text-anchor="middle" fill="#666" font-size="12">180° to 240°</text>
<text x="570.0" y="56" text-anchor="middle" fill="#333">Sector 5</text>
<text x="570.0" y="74" text-anchor="middle" fill="#666" font-size="12">240° to 300°</text>
<text x="670.0" y="56" text-anchor="middle" fill="#333">Sector 6</text>
<text x="670.0" y="74" text-anchor="middle" fill="#666" font-size="12">300° to 360°</text>
<line x1="120" y1="82" x2="120" y2="575" stroke="#ccc" stroke-dasharray="4 4"/>
<line x1="220" y1="82" x2="220" y2="575" stroke="#ccc" stroke-dasharray="4 4"/>
