<text x="270.0" y="423" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Z</text>
<text x="370.0" y="399" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">+</text>
<text x="470.0" y="399" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">+</text>
<text x="570.0" y="423" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Z</text>
<text x="670.0" y="471" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">-</text>
<text x="106" y="534" text-anchor="end" font-weight="bold" fill="#1f4e9c">Phase C</text>
<line x1="120" y1="530" x2="720" y2="530" stroke="#bbb"/>
<polyline points="120,530 220,530 220,530 220,554 320,554 320,554 420,554 420,554 420,530 520,530 520,530 520,506 620,506 620,506 720,506" fill="none" stroke="#1f4e9c" stroke-width="2.5"/>
<text x="170.0" y="523" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Z</text>
<text x="270.0" y="571" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">-</text>
<text x="370.0" y="571" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">-</text>
<text x="470.0" y="523" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Z</text>
<text x="570.0" y="499" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">+</text>
<text x="670.0" y="499" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">+</text>
<text x="120" y="606" fill="#444" font-size="13">+ : high-side switch on     - : low-side switch on     Z : phase off (floating)</text>
<text x="120" y="626" fill="#666" font-size="12">Illustrative sequence. The real order depends on motor wiring and Hall sensor placement.</text>
</svg>