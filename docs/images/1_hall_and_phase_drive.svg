<text x="570.0" y="371" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">-</text>
<text x="670.0" y="323" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Z</text>
<text x="106" y="434" text-anchor="end" font-weight="bold" fill="#1e8449">Phase B</text>
